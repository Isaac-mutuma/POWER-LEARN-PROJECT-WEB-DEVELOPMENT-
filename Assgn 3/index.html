<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <img src="profile.png" alt="Isaac Mutuma" class="profile-img">
        <h2 class="name">Isaac Mutuma</h2>
        <p class="tag">Web Developer</p>
        
        <div class="social-links">
            <a href="#" class="social-btn instagram">Instagram</a>
            <a href="#" class="social-btn facebook">Facebook</a>
            <a href="#" class="social-btn twitter">Twitter</a>
        </div>
    </div>

</body>
</html>
